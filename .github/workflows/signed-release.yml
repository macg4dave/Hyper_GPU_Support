name: Prepare signed Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (v followed by the Cargo version)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: signed-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  installer:
    runs-on: windows-2025
    environment: signpath-release
    timeout-minutes: 180
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
      SIGNPATH_EXPECTED_PUBLISHER: ${{ vars.SIGNPATH_EXPECTED_PUBLISHER }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check release configuration
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'An existing v<major.minor.patch> Cargo version tag is required; prerelease/build suffixes are unsupported.' }
          if ($env:GITHUB_REF -cne "refs/tags/$env:RELEASE_TAG") { throw 'Run this workflow with the existing release tag as its workflow ref as well as its tag input.' }
          foreach ($name in 'SIGNPATH_API_TOKEN', 'SIGNPATH_ORGANIZATION_ID', 'SIGNPATH_PROJECT_SLUG', 'SIGNPATH_SIGNING_POLICY_SLUG', 'SIGNPATH_EXPECTED_PUBLISHER') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing required signing configuration: $name" }
          }
          "WORK_DIRECTORY=$env:RUNNER_TEMP\HyperGpuSupport-release" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag and Cargo version
        run: |
          $ErrorActionPreference = 'Stop'
          $tagCommit = git rev-parse --verify "refs/tags/$($env:RELEASE_TAG)^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Release tag does not exist.' }
          $headCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $tagCommit -cne $headCommit -or $headCommit -cne $env:GITHUB_SHA) { throw 'Checkout does not match the existing tag and GitHub event commit.' }
          $metadataJson = cargo metadata --locked --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed.' }
          $metadata = $metadataJson | ConvertFrom-Json
          $product = @($metadata.packages | Where-Object name -eq 'hyper-gpu-support')
          if ($product.Count -ne 1 -or $env:RELEASE_TAG -cne "v$($product[0].version)") { throw 'Release tag and Cargo version differ.' }
          "RELEASE_VERSION=$($product[0].version)" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Provision pinned portable packaging tools
        run: ./scripts/release/prepare-tools.ps1 -Directory "$env:RUNNER_TEMP\HyperGpuSupport-tools"
      - name: Verify release staging failure paths
        run: ./scripts/release/test-release.ps1
      - name: Check and build release payload
        run: ./scripts/build-installer.ps1 -Stage BuildPayload -WorkDirectory $env:WORK_DIRECTORY -IsccPath $env:ISCC_PATH
      - name: Prepare the generated Inno uninstaller
        run: ./scripts/build-installer.ps1 -Stage PrepareUninstaller -WorkDirectory $env:WORK_DIRECTORY -OutputDirectory "$env:WORK_DIRECTORY\uninstaller-preparation" -IsccPath $env:ISCC_PATH
      - name: Prepare exact signing request
        run: ./scripts/release/stage-signing.ps1 -Stage Prepare -WorkDirectory $env:WORK_DIRECTORY
      - name: Upload payload signing input (never a release asset)
        id: payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: transient-payload-signing-input
          path: ${{ env.WORK_DIRECTORY }}/signing-input/
          if-no-files-found: error
          retention-days: 1
      - name: Request approval and sign payload plus uninstaller
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: windows-payload
          github-artifact-id: ${{ steps.payload.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ env.WORK_DIRECTORY }}/signed-result
          parameters: |
            version: "${{ env.RELEASE_VERSION }}"
      - name: Verify signed payload and package
        run: |
          ./scripts/release/stage-signing.ps1 -Stage Import -WorkDirectory $env:WORK_DIRECTORY -SignedDirectory "$env:WORK_DIRECTORY\signed-result" -ExpectedPublisher $env:SIGNPATH_EXPECTED_PUBLISHER
          $uninstallers = @(Get-ChildItem -LiteralPath "$env:WORK_DIRECTORY\signed-result\uninstaller" -Filter '*.exe' -File)
          if ($uninstallers.Count -ne 1) { throw 'Exactly one signed uninstaller is required.' }
          "SIGNED_UNINSTALLER=$($uninstallers[0].FullName)" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
          ./scripts/build-installer.ps1 -Stage Package -WorkDirectory $env:WORK_DIRECTORY -PayloadDirectory "$env:WORK_DIRECTORY\signed-payload" -UninstallerPath $uninstallers[0].FullName -OutputDirectory "$env:WORK_DIRECTORY\candidate" -Signed -ExpectedPublisher $env:SIGNPATH_EXPECTED_PUBLISHER -IsccPath $env:ISCC_PATH
      - name: Upload setup signing input (never a release asset)
        id: setup
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: transient-setup-signing-input
          path: ${{ env.WORK_DIRECTORY }}/candidate/HyperGpuSupport-${{ env.RELEASE_VERSION }}-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 1
      - name: Request approval and sign Setup
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: windows-setup
          github-artifact-id: ${{ steps.setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ env.WORK_DIRECTORY }}/signed-setup
          parameters: |
            version: "${{ env.RELEASE_VERSION }}"
      - name: Verify all signatures, embedded bytes and final checksum
        run: ./scripts/release/finalize-release.ps1 -WorkDirectory $env:WORK_DIRECTORY -SignedSetupDirectory "$env:WORK_DIRECTORY\signed-setup" -SignedUninstallerPath $env:SIGNED_UNINSTALLER -ExpectedPublisher $env:SIGNPATH_EXPECTED_PUBLISHER -UnpackerPath $env:INNOUNP_PATH -OutputDirectory "$env:WORK_DIRECTORY\release-ready"
      - name: Upload verified signed release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed-release-${{ env.RELEASE_VERSION }}-windows-x64
          path: ${{ env.WORK_DIRECTORY }}/release-ready/
          if-no-files-found: error
          retention-days: 30
