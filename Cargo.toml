[workspace]
members = ["."]
resolver = "3"

[package]
name = "hyper-gpu-support"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
description = "Windows GPU-PV project foundation"
publish = false
default-run = "hyper-gpu-support"

# Avoid incremental-cache finalization failures observed on the Windows workspace.
# The foundation is small; revisit caching when build time becomes material.
[profile.dev]
incremental = false

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Wdk_Graphics_Direct3D",
] }
