[workspace]
members = ["."]
resolver = "3"

[lib]
name = "hyper_gpu_support"

[package]
name = "hyper-gpu-lab"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
description = "Windows GPU-PV project foundation"
publish = false
default-run = "hyper-gpu-lab"

# Avoid incremental-cache finalization failures observed on the Windows workspace.
# The foundation is small; revisit caching when build time becomes material.
[profile.dev]
incremental = false

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[features]
default = []
# Explicit opt-in for the enrolled disposable laboratory; exclude from release packages.
dev-harness = []

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "0.9.8"
zeroize = "1.9.0"
rpassword = "7.5.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Vhd",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_TaskScheduler",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Wdk_Graphics_Direct3D",
] }
