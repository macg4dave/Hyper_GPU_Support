[package]
name = "app-install"
version = "0.5.0"
edition = "2024"
rust-version = "1.94.0"
description = "Hyper GPU Support installer launcher and package maintenance helper"
publish = false
license = "MIT"
repository = "https://github.com/macg4dave/Hyper_GPU_Support"

[dependencies]
sha2 = "=0.11.0"

[build-dependencies]
find-msvc-tools = "=0.1.14"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
# Zero today; keep it that way. Fix causes rather than suppressing (AGENTS.md).
dbg_macro = "deny"
unimplemented = "deny"
exit = "warn"
unused_result_ok = "warn"
