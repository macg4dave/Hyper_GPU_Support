[package]
name = "app-install"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
description = "Clean reinstall of the Hyper GPU Support build through Windows UAC"
publish = false

[dependencies]
sha2 = "=0.11.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_code = "deny"
