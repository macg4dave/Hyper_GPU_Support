# Progress screen. British English is the reference catalogue:
# it defines every key and argument; other languages translate the text only.

[copy]
complete = "Copying files · Complete"

[log.heading]
args = ["events: text"]
text = "Reported events (not proof of final state):\n{events}"

[stage]
allocation = "Applying your GPU resource settings"
authenticate = "Authenticating current signed driver files"
compatibility = "Updating GPU compatibility settings"
permission_preparation = "Waiting for any earlier status check to finish, then checking the protected app and requesting Windows administrator permission. No GPU changes have started. A Windows UAC prompt may require your response."
persist = "Saving progress"
prepare = "Preparing GPU driver files"
publish = "Saving the checked VM settings"
read_gpu = "Reading selected GPU and driver version"
read_vm = "Reading current VM state"
recovery_credentials = "Preparing recovery: reading saved sign-in or waiting for local administrator sign-in; no guest check has started"
recovery_outcome = "Checking the recorded recovery outcome; guest checks and final power restoration are not yet confirmed"
recovery_preparation = "Preparing recovery: waiting for protected worker startup; the recorded outcome is not yet confirmed"
save_only = "Retrying the bound configuration save"
shutdown = "Shutting down the VM safely"
start = "Starting the VM"
worker_admission = "Checking protected worker admission: waiting for the operation lock and authenticating installed files"
worker_connection = "Preparing protected worker: checking enrollment, waiting for Windows approval or connecting securely"

[status]
complete = "Complete"
failed = "Failed"
in_progress = "In progress"
waiting_result = "Waiting for final result; completion is not yet confirmed"

[status.line]
args = ["label: text", "status: message"]
text = "{label} · {status}"
