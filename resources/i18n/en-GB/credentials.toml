# Guest sign-in prompts. British English is the reference catalogue:
# it defines every key and argument; other languages translate the text only.

[guest_sign_in.message]
args = ["vm_name: text"]
text = "Sign in to {vm_name}\n\nEnter the user name and password of a Windows administrator account inside this virtual machine. They're used only for the steps you've approved.\n\nTo use them just this once, leave Remember unchecked. To save them securely on this computer for this VM, select Remember."

[native]
caption = "Hyper GPU Support - Sign in"

[settings]
title = "VM sign-in details"
