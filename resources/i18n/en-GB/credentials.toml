schema = 1
locale = "en-GB"
feature = "credentials"

[messages."credentials.explanation.caption"]
text = "Sign in to your virtual machine"
screen = "Native guest sign-in panels"
state = "credentials.explanation.caption"
audience = "operator"
intent = "Identify the local guest sign-in panel."
consequences = "No effects; presentation only."
severity = "information"
space_hint = "Native caption API budget where applicable; visual fit is advisory."
placeholders = []

[messages."credentials.explanation.wrapper"]
text = "{guest_message}\n\nChoose OK to enter your details. Cancel returns to the app."
screen = "Guest sign-in explanation MessageBox"
state = "Before native credential input"
audience = "operator"
intent = "Explain how to proceed or cancel."
consequences = "Cancel returns to the application without starting guest work."
severity = "information"
space_hint = "Wrapped explanation; MessageBox does not inherit Credential UI's message budget."
placeholders = [{ name = "guest_message", type = "message" }]

[messages."credentials.guest_sign_in.message"]
text = "Sign in to {vm_name}\n\nEnter the Windows administrator username and password you use inside this virtual machine. The app uses them for the guest steps you approve in review.\n\nRemember is optional. Leave it unchecked to use your details just this once; selecting it saves them securely on this computer for this VM."
screen = "Native Windows guest credential prompt; explanation dialog body"
state = "No saved opt-in credential; explanation precedes input"
audience = "operator"
intent = "Identify the guest account and explain optional local storage."
consequences = "Approved guest steps only; Remember is opt-in for the current user and exact VM."
severity = "information"
space_hint = "Native message budget is code-owned; explanation and prompt must remain readable."
placeholders = [{ name = "vm_name", type = "text" }]

[messages."credentials.native.caption"]
text = "Hyper GPU Support - Sign in"
screen = "Native guest sign-in panels"
state = "credentials.native.caption"
audience = "operator"
intent = "Identify the local guest sign-in panel."
consequences = "No effects; presentation only."
severity = "information"
space_hint = "Native caption API budget where applicable; visual fit is advisory."
placeholders = []

[messages."credentials.settings.title"]
text = "Guest credentials"
screen = "run presentation (src/gui/live.rs)"
state = "Selected branch: credentials.settings.title"
audience = "operator"
intent = "Present the existing selected state or action without changing its meaning."
consequences = "Preserve the reviewed effect, uncertainty and next-step facts of this branch; copy never grants authority."
severity = "information"
space_hint = "Preserve the existing layout; review wrapping and accessibility at supported sizes and scaling."
placeholders = []
