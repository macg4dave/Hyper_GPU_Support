# Guest sign-in prompts. British English is the reference catalogue:
# it defines every key and argument; other languages translate the text only.

[guest_sign_in.message]
args = ["vm_name: text"]
text = "Sign in to {vm_name} with a Windows administrator account from inside this VM. It is only used for the steps you approved. Tick Remember to save it securely on this PC, or leave it unticked to use it just this once."

[native]
caption = "Hyper GPU Support - Sign in"

[settings]
title = "VM sign-in details"
