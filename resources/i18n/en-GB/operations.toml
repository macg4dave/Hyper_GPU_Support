title = "Review Verify GPU setup"

[verify.review.body]
args = ["vm_name: text", "gpu_name: text", "lifecycle: message", "final_power: message"]
text = "Virtual machine: {vm_name}\nPhysical GPU: {gpu_name}\n\nVerify GPU setup: compare the current guest driver files and setup record with the approved driver package, then check the GPU's device health and hardware rendering. This checks current setup; a past successful check alone does not establish current health.\n\n{lifecycle}\nExpected final power after successful completion: {final_power}.\n\nUse the Windows administrator sign-in for this VM if prompted. File checks, starting Windows and rendering can take time; no exact duration is promised. This refreshes the check tools and diagnostic information inside the VM, but does not reinstall drivers, change GPU assignment or save settings.\n\nVerification continues directly after preparation. Windows prompts appear before guest access when required."

