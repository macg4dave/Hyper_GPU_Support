[verify.recovery]
body = "Check the recorded VM and GPU and get a fresh graphics result. If it's safe, the VM is returned to the power state you originally approved. No GPU assignment, allocation, driver setup or settings save takes place."
title = "Resolve interrupted graphics check"

[verify.review]
progress_title = "Preparing GPU check"
title = "Review Verify GPU setup"

[verify.review.body]
args = ["vm_name: text", "gpu_name: text", "lifecycle: message", "final_power: message"]
text = "Virtual machine: {vm_name}\nPhysical GPU: {gpu_name}\n\nVerify GPU setup compares the driver files and setup record inside the VM with the approved driver package, then checks the GPU's device status and hardware graphics. It checks the setup as it is now; an earlier successful check isn't enough.\n\n{lifecycle}\nFinal power state when finished: {final_power}.\n\nIf asked, sign in with a Windows administrator account for this VM. Checking files, starting Windows and testing graphics can take a while. The check tools and diagnostic information inside the VM are updated, but drivers aren't reinstalled, the GPU assignment isn't changed and settings aren't saved.\n\nThe check starts as soon as preparation finishes. Any Windows prompts appear before the VM is accessed."

[verify.review.details]
args = ["vm_id: text", "gpu_interface: text", "driver_version: text", "payload_digest: text", "power_debug: formatted"]
text = "VM ID: {vm_id}\nGPU interface: {gpu_interface}\nDriver version: {driver_version}\nDriver package hash: {payload_digest}\nCurrent power state: {power_debug}\n\nCompares the files inside the VM and the driver setup record with the signed driver file list on the host, then checks device status and graphics. The app's helper tools, file list and optional diagnostics inside the VM may be updated. The reviewed state is checked again independently before starting."

