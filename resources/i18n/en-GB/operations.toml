[profile_deletion.review.body]
args = ["vm_name: text", "vm_id: text", "gpu_interface: text"]
text = "Virtual machine: {vm_name}\nVM ID: {vm_id}\nGPU: {gpu_interface}\n\nThis deletes the app's profile for this VM: its saved GPU settings, GPU permission, setup history and records of interrupted operations. Recovery records are deleted even if an earlier operation didn't finish, and any unapplied changes for this VM are discarded.\n\nThe Hyper-V VM, its current GPU support, disks, checkpoints and the driver files inside it are kept. The VM won't be started or shut down, the GPU won't be detached, drivers won't be removed and you won't need to sign in. Other profiles aren't affected.\n\nSelect Delete profile to continue; Windows will ask for approval to remove the app's protected records. Select Cancel to keep the profile. The VM will still appear in the list so you can set it up again later."

