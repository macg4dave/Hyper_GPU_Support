[recovery.progress.body]
args = ["name: text", "action: message", "power: text"]
text = "{name}: {action}\nRecorded final power state: {power}. If the result is uncertain, recovery stays in place."

[recovery.review]
explanation = "Check whether the interrupted GPU change can be safely ended, or whether its reviewed result can be confirmed. GPU setup won't be repeated.\n\nIf fresh checks confirm the original host settings were restored, recovery can end without signing in to the VM. This doesn't confirm GPU setup or save the interrupted request.\n\nOtherwise, the check might start the VM temporarily and ask for its administrator sign-in details. If power changes are needed, the final power state is shown below. If anything has changed or is uncertain, recovery stays in place. Alternatively, Delete profile removes this VM's app settings, permission, history and recovery records, and leaves the VM and its GPU support as they are."
title = "Review interrupted operation"

[recovery.review.body]
args = ["vm_name: text"]
text = "Virtual machine: {vm_name}\n\nCheck the interrupted GPU operation without repeating it. In these cases, recovery can end without a new check inside the VM or signing in, but this doesn't confirm that setup worked:\n• A check inside the VM failed, and fresh checks confirm the host was restored to its original state. The failure stays recorded.\n• A setup or reinstall attempt stopped before driver setup began, and fresh checks confirm nothing changed.\n• This first setup attempt is back at its original state (VM off, no GPU attached). The attempt ends without saving the requested changes. Driver files might remain inside the VM but won't count as set up.\n\nOtherwise, the app checks whether the approved result was already reached. This might start the VM temporarily and ask for its administrator user name and password. The VM is shut down safely afterwards only with your approval. If the state is partial or has changed, recovery stays in place. No GPU setup work is repeated."

[recovery.unsaved]
title = "Outcome confirmed; settings not saved"

[recovery.unsaved.body]
args = ["error: text"]
text = "{error}\nTry saving the settings again."

