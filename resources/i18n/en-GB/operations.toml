[help]
body = "Select a VM and a physical GPU, turn on GPU support and choose how much GPU memory to assign, from 1 GB up to the GPU's capacity. To turn off GPU support, use the switch or More actions > Remove GPU support. Advanced allocation keeps exact memory values, and any saved compute, encode and decode settings are kept.\n\nApply, Verify GPU setup, Repair / Reinstall, Remove GPU support and Delete profile run straight away after fresh checks, without a separate review or confirmation. Choosing an action also approves any VM starts and shutdowns it needs. Windows sign-in and administrator (UAC) prompts still appear separately. The first setup gets permission and confirms it before making any GPU changes.\n\nSettings are saved only after the required checks pass. If saving fails, you can try saving again on its own. If an operation's result is uncertain, it needs to be resolved through recovery.\n\nDelete profile removes only this app's settings, permission, history and recovery records for the VM. It never changes the VM's power state, GPU attachment or files inside the VM. Switching a VM to a different GPU isn't available yet."
title = "Help"

