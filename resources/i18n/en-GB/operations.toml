[help]
body = "Select a real VM and physical GPU, enable GPU support in the draft and choose a VRAM request from 1 GB to the detected card capacity. Use the toggle or More actions > Remove GPU support to disable support. Advanced Allocation retains exact VRAM triples; saved Compute/Encode/Decode requests are preserved. Apply, Verify, Repair / Reinstall, removal and Delete profile proceed directly after fresh checks, without a review dialog or second confirmation. Selecting an action authorizes its required VM power transitions. First setup obtains permission and reads it back before preparing GPU changes. Windows credential and UAC prompts remain separate. Settings are saved only after the required outcome checks pass. Failed saving permits a save-only retry; uncertain operations require explicit reconciliation. Delete profile removes only this VM's app settings, pairing, history and recovery records; it never changes VM power, GPU attachment or guest files. GPU replacement remains unavailable."
