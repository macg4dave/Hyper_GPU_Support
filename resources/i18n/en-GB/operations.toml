[recovery.review]
explanation = "Check whether the interrupted GPU change can be safely ended or its reviewed result confirmed. GPU setup will not be repeated.\n\nIf fresh checks confirm the original host state was restored, recovery can end without guest sign-in. This does not certify GPU setup or save the interrupted request.\n\nOtherwise, the check may temporarily start the VM and request its guest administrator credentials. The reviewed final power state is shown below when power changes are required. Changed or uncertain facts keep recovery blocked. Delete profile instead discards this VM's app settings, pairing, history and recovery records while leaving the VM and its GPU support unchanged."
title = "Review interrupted operation"

[recovery.review.body]
args = ["vm_name: text"]
text = "Virtual machine: {vm_name}\n\nCheck the interrupted GPU operation without repeating it. A terminal failed guest check can end recovery after fresh reads confirm its original host lifecycle was restored; its failure remains recorded. A setup/reinstall attempt that never entered preparation can end after fresh reads confirm unchanged starting host state. These exits require no new guest check or credentials and do not certify setup. If fresh checks prove that this first setup attempt is back at its original stopped, unattached host configuration, end that attempt without saving its requested changes. Guest files may remain and will not count as verified preparation.\n\nOtherwise, check the already-achieved approved outcome. This may temporarily start the VM and require its guest administrator username and password. Stop it safely afterward only with your approval. Partial or changed state stays blocked; no GPU setup work is replayed."

