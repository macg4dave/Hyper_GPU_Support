# Technical details and diagnostics. British English is the reference catalogue:
# it defines every key and argument; other languages translate the text only.

copy = "Copy"
hide_label = "Hide technical details"
read_only_accessible = "Technical details, read-only"
select_all = "Select all"
show_label = "Show technical details"

[completion.unconfirmed]
args = ["original: text", "summary: text"]
text = "{original}\n\n{summary}\nThe result couldn't be confirmed. Select Refresh and review recovery before starting another operation."

[details.source]
args = ["details: text"]
text = "Source: information recorded for this review. Everything is checked again before any changes are made.\n\n{details}"

[draft]
absent = "No unapplied changes"
present = "Unapplied changes; see the editor for the exact values"

[failure]
provenance = "Source: this failure report and the last steps it reported. Select Refresh to see the VM's current state.\n"
stages_heading = "\nLast reported steps (these don't confirm the final state):\n"

[formatting]
unavailable = "Diagnostic details couldn't be displayed"

[history.graphics]
absent = "No successful graphics check recorded. An attached GPU doesn't confirm that graphics work inside the VM"
failed = "The last check inside the VM failed, so the current setup isn't confirmed. "
interrupted = "The last check was interrupted or didn't finish, so the VM's current state is unknown. "
mismatch = "The last check found driver files that don't match. Driver setup needs to be run again. "
passed = "The last driver and graphics check passed. Any recovery status is shown separately. "
unavailable = "The last check result isn't available, so the current setup is unknown. "
unknown = "Unknown; no matching graphics check record was found"

[history.graphics.last_success]
args = ["unix_time: u64"]
text = "Last successful graphics check: Unix time {unix_time} UTC (past result; current state unknown)"

[history.preparation]
absent = "No driver setup recorded"
historical = "Drivers were set up previously, but the files currently in the VM haven't been checked. Restoring a checkpoint can undo driver setup. Use Verify GPU setup to check the current state."
incomplete = "No completed driver setup recorded"
pair_mismatch = "The driver setup record doesn't match this VM's GPU permission. Review recovery"
pending = "Recovery pending; the driver setup result needs checking"
unavailable = "Driver setup record unavailable"

[history.saved]
absent = "No saved settings loaded"

[history.saved.no_request]
args = ["resource: text"]
text = "No {resource} value set; existing or Hyper-V values aren't changed"

[history.saved.provider_values]
args = ["resource: text", "minimum: text", "optimal: text", "maximum: text"]
text = "{resource} Hyper-V values: {minimum} / {optimal} / {maximum}"

[history.saved.summary]
args = ["support: message", "gpu_interface: text", "allocation: text"]
text = "GPU {support}; {gpu_interface}; {allocation}"

[history.summary]
failed = "last check failed; current state unknown"
incomplete = "last check didn't finish; current state unknown"
mismatch = "last check found mismatched driver files"
no_record = "unknown; no matching check record"
not_verified = "not verified"
previously_verified = "previously verified; current state unknown"
recovery_required = "recovery required; current state unknown"
unavailable = "last check unavailable; current state unknown"

[host_comparison]
baseline_unavailable = "the app's original compatibility values aren't available or don't apply"
historical = "the host information shown is out of date; select Refresh to compare"
inventory_unavailable = "host information isn't available"
matches = "Host configuration: all compared values match the saved settings."
observations_incomplete = "the latest host information is incomplete; check the diagnostics"
saved_absent = "no saved settings"
saved_unreadable = "the saved settings can't be read"
vm_missing = "the VM wasn't found when host information was last read"

[host_comparison.attachment_difference]
args = ["expected: text", "observed: text"]
text = "GPU attachment: expected {expected}, found {observed}"

[host_comparison.baseline_difference]
args = ["name: message", "expected: text", "observed: text"]
text = "{name} (original host value): expected {expected}, found {observed}"

[host_comparison.differences]
args = ["differences: text"]
text = "Host configuration differs from the saved settings: {differences}. Review these differences before repairing or removing GPU support."

[host_comparison.no_saved_request]
args = ["resource: text"]
text = "{resource} has no saved value"

[host_comparison.observed_unknown]
args = ["resource: text", "expected: text"]
text = "{resource}: expected {expected}, found Unknown"

[host_comparison.resource_difference]
args = ["resource: text", "expected: text", "observed: text"]
text = "{resource}: expected {expected}, found {observed}"

[host_comparison.unknown_reason]
args = ["reason: message"]
text = "Host configuration: Unknown; {reason}."

[host_comparison.unknowns]
args = ["unknowns: text"]
text = " Unknown: {unknowns}."

[host_comparison.attachments]
none = "none"

[observation]
current = "Source: the latest host information and the app's saved records. The VM itself wasn't checked again, so setup and graphics results are past results, not its current state."
historical = "Current information isn't available. The host information and history below are from earlier reads and may be out of date. Select Refresh."

[selected.details]
args = ["source: message", "facts: text", "host: text", "applied: text"]
text = "{source}\n{facts}\n\nHost comparison:\n{host}\n\nLast operation:\n{applied}\n\nGPU memory values are exact byte amounts, as requested or as read from Hyper-V. Hyper-V values don't guarantee that memory is reserved or isolated. Missing records or empty fields mean the information isn't available; they don't indicate success."

[stage]
original = "Original operation"
