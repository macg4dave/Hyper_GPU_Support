# Technical details and diagnostics. British English is the reference catalogue:
# it defines every key and argument; other languages translate the text only.

copy = "Copy"
hide_label = "Hide Technical Details"
read_only_accessible = "Technical details, read only"
select_all = "Select All"
show_label = "Show Technical Details"

[completion.unconfirmed]
args = ["original: text", "summary: text"]
text = "{original}\n\n{summary}\nCompletion records could not be confirmed. Use Refresh and inspect recovery before another operation."

[details.source]
args = ["details: text"]
text = "Source: facts captured for this review/record. Fresh protected checks are required before any effects.\n\n{details}"

[draft]
absent = "No draft recorded"
present = "Unapplied draft; see editor for current raw values"

[failure]
provenance = "Source: this reported failure and its last reported stages; current VM state may require Refresh.\n"
stages_heading = "\nLast reported stages (not proof of final state):\n"

[formatting]
unavailable = "Diagnostic formatting unavailable"

[history.graphics]
absent = "No recorded graphics verification; attachment does not prove guest health"
failed = "Latest guest check failed; current setup is not certified. "
interrupted = "Latest check interrupted or incomplete; current guest state unknown. "
mismatch = "Latest check found a guest payload mismatch; reviewed preparation is required. "
passed = "Latest guest payload and graphics check passed; recovery/lifecycle status applies separately. "
unavailable = "Latest guest check unavailable; current setup is unknown. "
unknown = "Unknown; no matching graphics verification record was read"

[history.graphics.last_success]
args = ["unix_time: u64"]
text = "Last successful checked rendering: Unix UTC {unix_time} (historical; current guest health unknown)"

[history.preparation]
absent = "No preparation record"
historical = "Previously prepared; current guest files and driver parity are unknown. A checkpoint rollback can undo guest setup. Use Verify to check current graphics health."
incomplete = "No completed preparation recorded"
pair_mismatch = "Preparation record does not match protected enrollment; inspect recovery"
pending = "Recovery pending; preparation outcome requires inspection"
unavailable = "Preparation record unavailable"

[history.saved]
absent = "No saved desired configuration loaded"

[history.saved.no_request]
args = ["resource: text"]
text = "No explicit {resource} request; existing/provider values are not reset"

[history.saved.provider_values]
args = ["resource: text", "minimum: text", "optimal: text", "maximum: text"]
text = "{resource} provider integers: {minimum} / {optimal} / {maximum}"

[history.saved.summary]
args = ["support: message", "gpu_interface: text", "allocation: text"]
text = "GPU {support}; {gpu_interface}; {allocation}"

[history.summary]
failed = "latest check failed; current health unknown"
incomplete = "latest check incomplete; current health unknown"
mismatch = "latest check found a driver-file mismatch"
no_record = "unknown; no matching check record"
not_verified = "not verified"
previously_verified = "previously verified; current health unknown"
recovery_required = "recovery required; current health unknown"
unavailable = "latest check unavailable; current health unknown"

[host_comparison]
baseline_unavailable = "managed compatibility baseline is unavailable or not applicable"
historical = "retained host observations are historical; Refresh to compare"
inventory_unavailable = "host inventory is unavailable"
matches = "Host configuration: compared values match the saved intent."
observations_incomplete = "latest host observations are incomplete; inspect diagnostics"
saved_absent = "no saved intent"
saved_unreadable = "saved intent is unreadable"
vm_missing = "VM was not returned by the latest host read"

[host_comparison.attachment_difference]
args = ["expected: text", "observed: text"]
text = "GPU attachment: expected {expected}; observed {observed}"

[host_comparison.baseline_difference]
args = ["name: message", "expected: text", "observed: text"]
text = "{name} (managed host baseline): expected {expected}; observed {observed}"

[host_comparison.differences]
args = ["differences: text"]
text = "Host configuration differences (saved intent / latest Hyper-V read): {differences}. Review changes before repair or GPU removal."

[host_comparison.no_saved_request]
args = ["resource: text"]
text = "{resource} has no explicit saved request"

[host_comparison.observed_unknown]
args = ["resource: text", "expected: text"]
text = "{resource}: expected {expected}; observed Unknown"

[host_comparison.resource_difference]
args = ["resource: text", "expected: text", "observed: text"]
text = "{resource}: expected {expected}; observed {observed}"

[host_comparison.unknown_reason]
args = ["reason: message"]
text = "Host configuration: Unknown; {reason}."

[host_comparison.unknowns]
args = ["unknowns: text"]
text = " Unknown: {unknowns}."

[host_comparison.attachments]
none = "none"

[observation]
current = "Source: latest host inventory and saved app records. No fresh guest check; setup/rendering history is historical, not current guest health."
historical = "Current observation unavailable. Retained host observations/history below are prior reads, not current health or execution authority; use Refresh."

[selected.details]
args = ["source: message", "facts: text", "host: text", "applied: text"]
text = "{source}\n{facts}\n\nHost comparison:\n{host}\n\nApplied operation:\n{applied}\n\nVRAM values are exact byte requests/readback; provider values do not establish reserved memory or enforced isolation. Missing records and null fields mean unavailable/absent facts, not proof of success."

[stage]
original = "Original operation"
