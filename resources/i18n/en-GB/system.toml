# System page. British English is the reference catalogue:
# it defines every key and argument; other languages translate the text only.

host_label = "This computer"
preparation_available = "available"
preparation_unsupported = "not implemented"
subtitle = "Virtual machines and GPUs discovered on this computer."
title = "System Information"

[discovery]
initial_setup_notice = "First-install inventory read through Windows elevation. Select a VM/GPU and Apply to review package setup and exact enrollment. GPU changes require a separate subsequent review."
permission_stage = "Protected enrollment"

[discovery.icon_metadata_failed]
args = ["error: text"]
text = "Could not save VM icon metadata: {error}"

[discovery.native_only]
args = ["error: text"]
text = "{error}. Native inventory only; editing is blocked."

[gpu.description]
args = ["interface: text", "driver: text", "resources: text", "adapter: message"]
text = "Interface: {interface}\nDriver: {driver}\n{resources}\nPreparation adapter: {adapter}\nAttachment does not prove guest graphics health; sharing is not qualified."
