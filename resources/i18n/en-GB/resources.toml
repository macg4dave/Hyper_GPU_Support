expand_label = "Expand"
maximum_label = "Maximum"
minimum_label = "Minimum"
optimal_label = "Optimal"
provider_unavailable = "Raw provider capability unknown; editing unavailable"
request_absent = "No explicit request"
retained_below_minimum_note = "The existing request is below 1 GB and has been retained exactly. The slider starts at 1 GB; edit it or use Advanced Allocation to change the request."
