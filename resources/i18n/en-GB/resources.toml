# GPU resource editor. British English is the reference catalogue:
# it defines every key and argument; other languages translate the text only.

collapse_label = "Collapse"
endpoint_rounding_note = "The maximum shown on the slider is rounded to the nearest whole GB. The exact value in bytes is kept and shown in the review and in Technical details."
expand_label = "Expand"
maximum_label = "Maximum"
minimum_label = "Minimum"
optimal_label = "Optimal"
provider_unavailable = "The GPU's supported range is unknown, so these values can't be edited"
request_absent = "Not set"
retained_below_minimum_note = "The current value is below 1 GB and has been kept exactly as it is. The slider starts at 1 GB; move it or use Advanced allocation to change the value."
unspecified = "Not specified"

[default_suffix]
args = ["default_value: formatted"]
text = "{default_value} (default)"

[advanced]
collapsed_accessible = "Advanced allocation, collapsed"
expanded_accessible = "Advanced allocation, expanded"
label = "Advanced allocation"

[edit]
cut = "Cut"
paste = "Paste"
redo = "Redo"
undo = "Undo"

[field.accessible]
args = ["field_label: message"]
text = "{field_label} allocation"

[memory]
below_minimum = "This GPU has less than 1 GB of memory, which is below the slider's minimum. GPU memory can't be selected."
decimal_required = "Enter a value in GB with up to nine decimal places. The previous value is kept."
exceeds_physical = "The current value is more than the GPU's memory. It hasn't been changed; use Advanced allocation to adjust it."
fields_incomplete = "Fill in or clear all three GPU memory fields to use the slider."
fields_unavailable = "GPU memory values aren't available."
invalid_decimal = "Enter a valid number of GB"
invalid_value = "Enter a valid memory value"
outside_range = "The selected value is outside the available GPU memory range."
overflow = "This value is too large to convert"
precision_exceeded = "The slider can't represent this memory range exactly. Use Advanced allocation."
range_invalid = "Correct the GPU memory range in Advanced allocation to use the slider."
too_large = "This memory value is too large"

[memory.request_range]
args = ["maximum: text"]
text = "Enter a value from 1 GB to {maximum}. The previous value is kept."

[units.gb]
args = ["amount: text"]
text = "{amount} GB"

[units.gib]
args = ["amount: text"]
text = "{amount} GiB"
