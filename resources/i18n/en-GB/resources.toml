undo = "Undo"

[field.accessible]
args = ["field_label: message"]
text = "{field_label} allocation"

[memory]
below_minimum = "Detected physical VRAM is below the slider's 1 GB minimum. GPU memory selection is unavailable."
decimal_required = "Enter a decimal GB value with at most nine decimal places. The previous request is kept."
exceeds_physical = "The current request exceeds detected physical VRAM. Use Advanced Allocation; it has not been rewritten."
fields_incomplete = "Complete or clear all three VRAM fields to use the slider."
fields_unavailable = "VRAM fields are unavailable."
invalid_decimal = "Invalid decimal memory value"
invalid_value = "Invalid memory value"
outside_range = "The selected memory value is outside the current VRAM range."
overflow = "Memory conversion overflow"
precision_exceeded = "VRAM bounds exceed exact slider precision. Use Advanced Allocation."
range_invalid = "Correct the VRAM range in Advanced Allocation to use the slider."
too_large = "Memory value is too large"

[memory.request_range]
args = ["maximum: text"]
text = "Enter a request from 1 GB to {maximum}. The previous request is kept."

[units.gb]
args = ["amount: text"]
